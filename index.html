<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clair Repas">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Clair Repas V1.3.1</title>
<style>
:root{
  --bg:#f4efe7;--card:#fffdfa;--text:#27231f;--muted:#746c63;
  --green:#3f7657;--green-soft:#e3f0e8;--line:#e6ddd3;
  --purple:#665581;--gold:#9a6a18
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
main{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}
header{text-align:center;margin:3px 0 15px}
h1{font-size:30px;margin:0 0 3px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:14px}
.settings,.day-card,.history{background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 26px rgba(45,35,25,.055)}
.settings{padding:13px;margin-bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--text)}
.day-card{padding:16px;margin:12px 0}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.day-title{font-weight:900;font-size:18px;color:var(--green)}
.day-date{font-size:12px;color:var(--muted);text-transform:capitalize}
.meal{padding:14px 0 2px}
.meal+.meal{border-top:1px dashed var(--line);margin-top:12px}
.tag{font-size:12px;font-weight:850;color:var(--green);letter-spacing:.35px}
.tag.evening{color:var(--purple)}
.meal-title{font-size:21px;line-height:1.16;margin:7px 0 5px}
.meta{color:var(--muted);font-size:13px}
.meal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.small-btn{padding:10px 8px;border:0;border-radius:12px;background:var(--green-soft);color:var(--text);font-weight:760}
.small-btn.secondary{background:#f2eee9}
.recipe{display:none;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.recipe.open{display:block}
.recipe h3{margin:10px 0 5px;font-size:16px}
.recipe ul,.recipe ol{padding-left:21px;line-height:1.46;margin:5px 0}
.actions{display:grid;gap:9px;margin-top:15px}
.actions button{width:100%;padding:14px;border-radius:15px;border:1px solid var(--line);background:white;color:var(--text);font-weight:820}
.actions .primary{background:var(--green);border-color:var(--green);color:white;font-size:17px}
.actions .liked{color:var(--gold);background:#fff4da;border-color:#ead19a}
.history{margin-top:14px;overflow:hidden}
.history summary{padding:14px 16px;font-weight:800;cursor:pointer;list-style:none}
.history summary::-webkit-details-marker{display:none}
.history-content{border-top:1px solid var(--line);padding:10px 16px 14px}
.history-item{padding:9px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:0}
.history-date{font-size:12px;color:var(--muted);margin-bottom:4px}
.history-meals{font-size:13px;line-height:1.42}
.empty{color:var(--muted);font-size:14px}
.note{text-align:center;color:var(--muted);font-size:12px;margin:13px 0 0}
.version{text-align:center;color:#9a9187;font-size:11px;margin-top:7px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#28231f;color:white;padding:11px 15px;border-radius:999px;display:none;z-index:9;max-width:88%;text-align:center}
.toast.show{display:block}
@media(max-width:560px){
  .settings{grid-template-columns:1fr 1fr}
  .settings .mode-setting{grid-column:1/-1}
}
@media(max-width:390px){
  .settings{display:block}.settings>div+div{margin-top:10px}
  .meal-title{font-size:20px}
  .meal-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
<header>
  <h1>🍽️ Clair Repas</h1>
  <div class="subtitle">Les repas et les courses, simplement.</div>
</header>

<section class="settings">
  <div>
    <label for="people">Pour combien ?</label>
    <select id="people">
      <option value="1">1 personne</option>
      <option value="2" selected>2 personnes</option>
      <option value="3">3 personnes</option>
      <option value="4">4 personnes</option>
    </select>
  </div>
  <div>
    <label for="days">Prévoir pour</label>
    <select id="days">
      <option value="1">1 jour</option>
      <option value="2" selected>2 jours</option>
      <option value="3">3 jours</option>
    </select>
  </div>
  <div class="mode-setting">
    <label for="mode">Cuisson préférée</label>
    <select id="mode">
      <option value="Tous">Toutes</option>
      <option>Poêle</option>
      <option>Air Fryer</option>
      <option>Four</option>
      <option>Plancha</option>
      <option>Barbecue</option>
      <option>Sans cuisson</option>
    </select>
  </div>
</section>

<div id="daysContainer"></div>

<div class="actions">
  <button class="primary" id="newPlan">🎲 Nouveau programme</button>
  <button id="courses">🛒 Copier toutes les courses</button>
  <button id="favorite">☆ J’aime ces menus</button>
</div>

<details class="history">
  <summary>🕘 Les derniers programmes</summary>
  <div class="history-content" id="historyContent"></div>
</details>

<p class="note">Les produits identiques sont regroupés et convertis en quantités réellement achetables.</p>
<p class="version">Clair Repas V1.3.1 · courses réelles</p>
</main>

const $=id=>document.getElementById(id);
const todayKey=()=>new Date().toLocaleDateString('en-CA');
const season=()=>{
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=5)return'printemps';
  if(m>=6&&m<=8)return'été';
  if(m>=9&&m<=11)return'automne';
  return'hiver';
};
let plan=[];

$('people').value=localStorage.getItem('crPeople')||'2';
$('days').value=localStorage.getItem('crDays')||'2';
$('mode').value=localStorage.getItem('crMode')||'Tous';

function dateFor(index){
  const d=new Date();
  d.setDate(d.getDate()+index);
  return d;
}
function dayLabel(index){
  if(index===0)return"Aujourd’hui";
  if(index===1)return"Demain";
  return"Après-demain";
}
function formatDate(index){
  return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(dateFor(index));
}
function formatQty(q){
  if(q==null)return'';
  const rounded=Math.round(q*100)/100;
  const special={0.25:'¼',0.5:'½',0.75:'¾',1.5:'1½'};
  return special[rounded]||String(rounded).replace('.',',');
}
function qtyForPeople(q){
  return q==null?null:q*(Number($('people').value)/2);
}
function ingredientText(x,qOverride){
  const q=qOverride===undefined?qtyForPeople(x.q):qOverride;
  if(q==null)return x.n;
  return [formatQty(q),x.u,x.n].filter(Boolean).join(' ');
}
function recipeHTML(x){
  return `<h3>Ingrédients</h3><ul>${x.i.map(v=>`<li>${ingredientText(v)}</li>`).join('')}</ul>
  <h3>Préparation</h3><ol>${x.p.map(v=>`<li>${v}</li>`).join('')}</ol>`;
}
function priorRecentIds(type){
  const h=JSON.parse(localStorage.getItem('crHistoryV13')||'[]').filter(x=>x.date!==todayKey()).slice(0,5);
  const ids=[];
  h.forEach(entry=>(entry.plan||[]).forEach(d=>ids.push(type==='mid'?d.midId:d.eveId)));
  return new Set(ids);
}
function poolFor(list,type,exclude){
  const pref=$('mode').value;
  const now=season();
  let pool=list.filter(x=>x.s.includes(now));
  if(pref!=='Tous'){
    pool=pool.filter(x=>x.m===pref || (type==='eve'&&x.m==='Sans cuisson'));
  }
  if(!pool.length)pool=list.filter(x=>x.s.includes(now));
  if(!pool.length)pool=[...list];

  const recent=priorRecentIds(type);
  let clean=pool.filter(x=>!exclude.has(x.id)&&!recent.has(x.id));
  if(!clean.length)clean=pool.filter(x=>!exclude.has(x.id));
  if(!clean.length)clean=pool;
  return clean;
}
function pick(list,type,exclude){
  const pool=poolFor(list,type,exclude);
  const favs=new Set(JSON.parse(localStorage.getItem('crFavMeals')||'[]'));
  const weighted=[...pool,...pool.filter(x=>favs.has(x.id))];
  return weighted[Math.floor(Math.random()*weighted.length)];
}
function buildPlan(count){
  const mids=new Set(), eves=new Set(), result=[];
  for(let i=0;i<count;i++){
    const mid=pick(noon,'mid',mids); mids.add(mid.id);
    const eve=pick(evening,'eve',eves); eves.add(eve.id);
    result.push({mid,eve});
  }
  return result;
}
function saveState(){
  localStorage.setItem('crStateV13',JSON.stringify({
    date:todayKey(),
    days:Number($('days').value),
    mode:$('mode').value,
    plan:plan.map(d=>({midId:d.mid.id,eveId:d.eve.id}))
  }));
}
function saveHistory(){
  let h=JSON.parse(localStorage.getItem('crHistoryV13')||'[]');
  h=h.filter(x=>x.date!==todayKey());
  h.unshift({
    date:todayKey(),
    plan:plan.map(d=>({midId:d.mid.id,eveId:d.eve.id,mid:d.mid.n,eve:d.eve.n}))
  });
  localStorage.setItem('crHistoryV13',JSON.stringify(h.slice(0,10)));
  renderHistory();
}
function renderHistory(){
  const h=JSON.parse(localStorage.getItem('crHistoryV13')||'[]');
  if(!h.length){$('historyContent').innerHTML='<div class="empty">Aucun ancien programme pour le moment.</div>';return}
  $('historyContent').innerHTML=h.slice(0,5).map(x=>{
    const d=new Date(x.date+'T12:00:00');
    const date=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'}).format(d);
    const meals=(x.plan||[]).map((p,i)=>`<strong>J${i+1}</strong> · ${p.mid}<br>↳ ${p.eve}`).join('<br>');
    return `<div class="history-item"><div class="history-date">${date}</div><div class="history-meals">${meals}</div></div>`;
  }).join('');
}
function updateLikedButton(){
  const favs=new Set(JSON.parse(localStorage.getItem('crFavMeals')||'[]'));
  const ids=plan.flatMap(d=>[d.mid.id,d.eve.id]);
  const allLiked=ids.length>0&&ids.every(id=>favs.has(id));
  $('favorite').classList.toggle('liked',allLiked);
  $('favorite').textContent=allLiked?'★ Menus aimés':'☆ J’aime ces menus';
}
function render(){
  $('daysContainer').innerHTML=plan.map((d,i)=>`
    <section class="day-card">
      <div class="day-head">
        <div class="day-title">${dayLabel(i)}</div>
        <div class="day-date">${formatDate(i)}</div>
      </div>

      <div class="meal">
        <div class="tag">☀️ MIDI · PLAT COMPLET</div>
        <div class="meal-title">${d.mid.n}</div>
        <div class="meta">⏱️ ${d.mid.t} · 🔥 ${d.mid.m}</div>
        <div class="meal-actions">
          <button class="small-btn recipe-btn" data-day="${i}" data-type="mid">📖 Voir la recette</button>
          <button class="small-btn secondary change-btn" data-day="${i}" data-type="mid">🔄 Changer le midi</button>
        </div>
        <div class="recipe" id="recipe-${i}-mid">${recipeHTML(d.mid)}</div>
      </div>

      <div class="meal">
        <div class="tag evening">🌙 SOIR · LÉGER ET RASSASIANT</div>
        <div class="meal-title">${d.eve.n}</div>
        <div class="meta">⏱️ ${d.eve.t} · 🔥 ${d.eve.m}</div>
        <div class="meal-actions">
          <button class="small-btn recipe-btn" data-day="${i}" data-type="eve">📖 Voir la recette</button>
          <button class="small-btn secondary change-btn" data-day="${i}" data-type="eve">🔄 Changer le soir</button>
        </div>
        <div class="recipe" id="recipe-${i}-eve">${recipeHTML(d.eve)}</div>
      </div>
    </section>`).join('');

  document.querySelectorAll('.recipe-btn').forEach(b=>b.onclick=()=>{
    const el=$(`recipe-${b.dataset.day}-${b.dataset.type}`);
    const open=el.classList.toggle('open');
    b.textContent=open?'📕 Masquer la recette':'📖 Voir la recette';
  });

  document.querySelectorAll('.change-btn').forEach(b=>b.onclick=()=>{
    changeMeal(Number(b.dataset.day),b.dataset.type);
  });

  updateLikedButton();
  saveState();
  saveHistory();
}
function changeMeal(index,type){
  const used=new Set(plan.map(d=>type==='mid'?d.mid.id:d.eve.id));
  used.delete(type==='mid'?plan[index].mid.id:plan[index].eve.id);
  if(type==='mid')plan[index].mid=pick(noon,'mid',used);
  else plan[index].eve=pick(evening,'eve',used);
  render();
}
function ensureDays(){
  const count=Number($('days').value);
  if(plan.length>count)plan=plan.slice(0,count);
  while(plan.length<count){
    const mids=new Set(plan.map(d=>d.mid.id));
    const eves=new Set(plan.map(d=>d.eve.id));
    plan.push({mid:pick(noon,'mid',mids),eve:pick(evening,'eve',eves)});
  }
}
function loadOrCreate(){
  const saved=JSON.parse(localStorage.getItem('crStateV13')||'null');
  if(saved&&saved.date===todayKey()&&Array.isArray(saved.plan)){
    const loaded=saved.plan.map(d=>({
      mid:noon.find(x=>x.id===d.midId),
      eve:evening.find(x=>x.id===d.eveId)
    })).filter(d=>d.mid&&d.eve);
    if(loaded.length){
      plan=loaded;
      ensureDays();
      render();
      return;
    }
  }
  plan=buildPlan(Number($('days').value));
  render();
}
function shopKey(x){
  return String(x.k||x.n).toLowerCase().trim();
}
function wholeCount(q){
  return Math.max(1,Math.ceil(Number(q)-0.00001));
}
function countText(q,singular,plural){
  const n=wholeCount(q);
  return `${n} ${n>1?(plural||singular+'s'):singular}`;
}
function roundedWeightText(g,step=500){
  const rounded=Math.ceil(Number(g)/step)*step;
  if(rounded>=1000){
    const kg=rounded/1000;
    return `${formatQty(kg)} kg`;
  }
  return `${rounded} g`;
}
function packCount(q,capacity){
  return Math.max(1,Math.ceil(Number(q)/capacity));
}
function purchaseText(x){
  const key=shopKey(x);
  const q=x.hasQty?Number(x.q):null;
  const unit=String(x.u||'').toLowerCase();

  // Fruits et légumes : on achète des pièces entières.
  const pieces={
    'courgettes':['courgette','courgettes'],
    'poivrons':['poivron','poivrons'],
    'oignons':['oignon','oignons'],
    'citrons':['citron','citrons'],
    'concombres':['concombre','concombres'],
    'carottes':['carotte','carottes'],
    'échalotes':['échalote','échalotes'],
    'tomates':['tomate','tomates'],
    'avocats':['avocat','avocats'],
    'poireaux':['poireau','poireaux'],
    'salades vertes':['salade','salades']
  };
  if(q!=null&&pieces[key])return countText(q,pieces[key][0],pieces[key][1]);

  // Produits vendus en boîtes, paquets, pots, briques ou sachets.
  if(key==='œufs'&&q!=null){
    const n=wholeCount(q);
    if(n<=6)return'1 boîte de 6 œufs';
    if(n<=12)return'1 boîte de 12 œufs';
    return `${Math.ceil(n/12)} boîtes de 12 œufs`;
  }
  if(key==='gousses d’ail'&&q!=null){
    const heads=Math.max(1,Math.ceil(q/8));
    return heads===1?'1 tête d’ail':`${heads} têtes d’ail`;
  }
  if(key==='tranches de pain de mie'&&q!=null){
    const n=packCount(q,20);
    return n===1?'1 paquet de pain de mie':`${n} paquets de pain de mie`;
  }
  if((key==='tranches de pain'||key==='grandes tranches de pain')&&q!=null){
    const n=packCount(q,8);
    return n===1?'1 pain':`${n} pains`;
  }
  if(key==='pommes de terre'&&q!=null&&unit==='g'){
    return `${roundedWeightText(q,500)} de pommes de terre`;
  }
  if((key==='pâtes'||key==='riz'||key==='riz cuit')&&q!=null&&unit==='g'){
    const n=packCount(q,500);
    const label=key==='pâtes'?'pâtes':'riz';
    return n===1?`1 paquet de ${label} (500 g)`:`${n} paquets de ${label} (500 g)`;
  }
  if(key==='chapelure'&&q!=null)return'1 paquet de chapelure';
  if(key==='lentilles cuites'&&q!=null)return'1 boîte de lentilles';
  if(key==='tomates cerises'&&q!=null){
    const n=packCount(q,250);
    return n===1?'1 barquette de tomates cerises (250 g)':`${n} barquettes de tomates cerises (250 g)`;
  }
  if(key==='champignons'&&q!=null){
    const n=packCount(q,250);
    return n===1?'1 barquette de champignons (250 g)':`${n} barquettes de champignons (250 g)`;
  }
  if(key==='haricots verts'&&q!=null){
    const n=packCount(q,500);
    return n===1?'1 sachet de haricots verts (500 g)':`${n} sachets de haricots verts (500 g)`;
  }
  if(key==='saumon fumé'&&q!=null){
    const n=packCount(q,200);
    return n===1?'1 paquet de saumon fumé (200 g)':`${n} paquets de saumon fumé (200 g)`;
  }
  if(key==='crevettes cuites'&&q!=null){
    const n=packCount(q,200);
    return n===1?'1 barquette de crevettes (200 g)':`${n} barquettes de crevettes (200 g)`;
  }
  if(key==='crème'&&q!=null&&unit==='cl'){
    if(q<=25)return'1 briquette de crème (25 cl)';
    if(q<=50)return'1 bouteille de crème (50 cl)';
    return `${Math.ceil(q/50)} bouteilles de crème (50 cl)`;
  }
  if(key==='lait'&&q!=null&&unit==='cl'){
    if(q<=50)return'1 petite brique de lait (50 cl)';
    return'1 bouteille de lait (1 L)';
  }
  if(key==='coulis de tomate'&&q!=null)return'1 brique de coulis de tomate';
  if(key==='bouillon'&&q!=null)return'1 brique de bouillon (1 L)';
  if(key==='fromage râpé'&&q!=null)return'1 sachet de fromage râpé';
  if(key==='gruyère'&&q!=null)return'1 sachet de gruyère râpé';
  if(key==='fromage'&&q!=null)return'1 sachet de fromage râpé';
  if(key==='feta'&&q!=null)return'1 paquet de feta';
  if(key==='fromage frais'&&q!=null)return'1 pot de fromage frais';
  if(key==='thon')return q==null?'1 boîte de thon':`${wholeCount(q)} boîte${wholeCount(q)>1?'s':''} de thon`;
  if(key==='maïs')return q==null?'1 petite boîte de maïs':`${wholeCount(q)} petite${wholeCount(q)>1?'s':''} boîte${wholeCount(q)>1?'s':''} de maïs`;

  // Condiments et épices : la quantité de recette devient un contenant.
  const containers={
    'ketchup':'1 flacon de ketchup',
    'moutarde':'1 pot de moutarde',
    'concentré de tomate':'1 tube de concentré de tomate',
    'paprika':'1 pot de paprika',
    'curry':'1 pot de curry',
    'miel':'1 pot de miel',
    'vinaigre balsamique':'1 bouteille de vinaigre balsamique',
    'olives':'1 bocal d’olives',
    'vinaigrette':'1 bouteille de vinaigrette',
    'sauce légère':'1 flacon de sauce légère',
    'huile':'1 bouteille d’huile',
    'huile d’olive':'1 bouteille d’huile d’olive',
    'beurre':'1 plaquette de beurre'
  };
  if(containers[key])return containers[key];

  // Herbes fraîches.
  const herbs={
    'aneth':'1 bouquet d’aneth',
    'basilic':'1 bouquet de basilic',
    'ciboulette':'1 bouquet de ciboulette',
    'persil':'1 bouquet de persil'
  };
  if(herbs[key])return herbs[key];

  // La viande et le poisson vendus au poids gardent leur quantité exacte.
  if(!x.hasQty)return x.n;
  return ingredientText(x,x.q);
}
function groupedCourses(){
  const map=new Map();
  const all=plan.flatMap(d=>[...d.mid.i,...d.eve.i]);
  all.forEach(item=>{
    const q=qtyForPeople(item.q);
    const key=`${String(item.k).toLowerCase()}|${item.u||''}`;
    if(!map.has(key))map.set(key,{...item,q:0,hasQty:q!=null});
    const entry=map.get(key);
    if(q==null){
      entry.hasQty=false;
    }else{
      entry.q+=q;
    }
  });
  return [...map.values()].map(purchaseText);
}
function show(t){
  $('toast').textContent=t;
  $('toast').classList.add('show');
  setTimeout(()=>$('toast').classList.remove('show'),1900);
}
$('newPlan').onclick=()=>{
  plan=buildPlan(Number($('days').value));
  render();
};
$('days').onchange=()=>{
  localStorage.setItem('crDays',$('days').value);
  ensureDays();
  render();
};
$('people').onchange=()=>{
  localStorage.setItem('crPeople',$('people').value);
  render();
};
$('mode').onchange=()=>{
  localStorage.setItem('crMode',$('mode').value);
  plan=buildPlan(Number($('days').value));
  render();
};
$('favorite').onclick=()=>{
  const favs=new Set(JSON.parse(localStorage.getItem('crFavMeals')||'[]'));
  const ids=plan.flatMap(d=>[d.mid.id,d.eve.id]);
  const allLiked=ids.every(id=>favs.has(id));
  ids.forEach(id=>allLiked?favs.delete(id):favs.add(id));
  localStorage.setItem('crFavMeals',JSON.stringify([...favs]));
  updateLikedButton();
  show(allLiked?'Menus retirés des favoris':'Menus enregistrés');
};
$('courses').onclick=async()=>{
  const text=groupedCourses().join('\n');
  try{
    await navigator.clipboard.writeText(text);
    show('Toutes les courses ont été copiées');
  }catch(e){
    prompt('Copie cette liste :',text);
  }
};

loadOrCreate();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
