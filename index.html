<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clair Repas">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Clair Repas V1.2</title>
<style>
:root{
  --bg:#f4efe7;--card:#fffdfa;--text:#27231f;--muted:#746c63;
  --green:#3f7657;--green-soft:#e3f0e8;--line:#e6ddd3;
  --purple:#665581;--gold:#9a6a18;--danger:#934b4b
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
main{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}
header{text-align:center;margin:3px 0 15px}
h1{font-size:30px;margin:0 0 3px;letter-spacing:-.5px}
.date{color:var(--muted);font-size:14px;text-transform:capitalize}
.settings,.card,.history{background:var(--card);border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 26px rgba(45,35,25,.055)}
.settings{padding:13px;margin-bottom:13px;display:flex;gap:10px;align-items:end}
.settings>div{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--text)}
.card{padding:17px;margin:12px 0}
.tag{font-size:13px;font-weight:850;color:var(--green);letter-spacing:.35px}
.tag.evening{color:var(--purple)}
.meal-title{font-size:24px;line-height:1.15;margin:8px 0 6px}
.meta{color:var(--muted);font-size:14px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.small-btn{padding:11px 9px;border:0;border-radius:13px;background:var(--green-soft);color:var(--text);font-weight:760}
.small-btn.secondary{background:#f2eee9}
.recipe{display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.recipe.open{display:block}
.recipe h3{margin:11px 0 5px;font-size:17px}
.recipe ul,.recipe ol{padding-left:21px;line-height:1.48;margin:5px 0}
.actions{display:grid;gap:9px;margin-top:15px}
.actions button{width:100%;padding:14px;border-radius:15px;border:1px solid var(--line);background:white;color:var(--text);font-weight:820}
.actions .primary{background:var(--green);border-color:var(--green);color:white;font-size:17px}
.actions .favorite.on{color:var(--gold);background:#fff4da;border-color:#ead19a}
.history{margin-top:14px;overflow:hidden}
.history summary{padding:14px 16px;font-weight:800;cursor:pointer;list-style:none}
.history summary::-webkit-details-marker{display:none}
.history-content{border-top:1px solid var(--line);padding:10px 16px 14px}
.history-item{padding:9px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:0}
.history-date{font-size:12px;color:var(--muted);margin-bottom:3px}
.history-meals{font-size:14px;line-height:1.35}
.empty{color:var(--muted);font-size:14px}
.note{text-align:center;color:var(--muted);font-size:12px;margin:13px 0 0}
.version{text-align:center;color:#9a9187;font-size:11px;margin-top:7px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#28231f;color:white;padding:11px 15px;border-radius:999px;display:none;z-index:9;max-width:88%;text-align:center}
.toast.show{display:block}
@media(max-width:420px){
  .settings{display:block}.settings>div+div{margin-top:10px}
  .meal-title{font-size:22px}
  .card-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
<header>
  <h1>🍽️ Clair Repas</h1>
  <div class="date" id="date"></div>
</header>

<section class="settings">
  <div>
    <label for="people">Pour combien ?</label>
    <select id="people">
      <option value="1">1 personne</option>
      <option value="2" selected>2 personnes</option>
      <option value="3">3 personnes</option>
      <option value="4">4 personnes</option>
    </select>
  </div>
  <div>
    <label for="mode">Cuisson préférée</label>
    <select id="mode">
      <option value="Tous">Toutes</option>
      <option>Poêle</option>
      <option>Air Fryer</option>
      <option>Four</option>
      <option>Plancha</option>
      <option>Barbecue</option>
      <option>Sans cuisson</option>
    </select>
  </div>
</section>

<section class="card">
  <div class="tag">☀️ MIDI · PLAT COMPLET</div>
  <div class="meal-title" id="midTitle"></div>
  <div class="meta" id="midMeta"></div>
  <div class="card-actions">
    <button class="small-btn" data-target="midRecipe">📖 Voir la recette</button>
    <button class="small-btn secondary" id="changeMid">🔄 Changer le midi</button>
  </div>
  <div class="recipe" id="midRecipe"></div>
</section>

<section class="card">
  <div class="tag evening">🌙 SOIR · LÉGER ET RASSASIANT</div>
  <div class="meal-title" id="eveTitle"></div>
  <div class="meta" id="eveMeta"></div>
  <div class="card-actions">
    <button class="small-btn" data-target="eveRecipe">📖 Voir la recette</button>
    <button class="small-btn secondary" id="changeEve">🔄 Changer le soir</button>
  </div>
  <div class="recipe" id="eveRecipe"></div>
</section>

<div class="actions">
  <button class="primary" id="surprise">🎲 Surprends-nous</button>
  <button id="courses">🛒 Copier les courses du jour</button>
  <button class="favorite" id="favorite">☆ J’aime ce menu</button>
</div>

<details class="history">
  <summary>🕘 Les derniers menus</summary>
  <div class="history-content" id="historyContent"></div>
</details>

<p class="note">Le menu reste le même toute la journée et les répétitions sont évitées.</p>
<p class="version">Clair Repas V1.2</p>
</main>
<div class="toast" id="toast"></div>

const $=id=>document.getElementById(id);
const todayKey=()=>new Date().toLocaleDateString('en-CA');
const season=()=>{
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=5)return'printemps';
  if(m>=6&&m<=8)return'été';
  if(m>=9&&m<=11)return'automne';
  return'hiver';
};
let current={mid:null,eve:null};

$('date').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
$('people').value=localStorage.getItem('crPeople')||'2';
$('mode').value=localStorage.getItem('crMode')||'Tous';

function formatQty(q){
  if(q==null)return'';
  const rounded=Math.round(q*100)/100;
  if(rounded===0.25)return'¼';
  if(rounded===0.5)return'½';
  if(rounded===0.75)return'¾';
  if(rounded===1.5)return'1½';
  return String(rounded).replace('.',',');
}
function ingredientText(x){
  if(x.q==null)return x.n;
  const factor=Number($('people').value)/2;
  const q=formatQty(x.q*factor);
  return [q,x.u,x.n].filter(Boolean).join(' ');
}
function recipeHTML(x){
  return `<h3>Ingrédients</h3><ul>${x.i.map(v=>`<li>${ingredientText(v)}</li>`).join('')}</ul>
  <h3>Préparation</h3><ol>${x.p.map(v=>`<li>${v}</li>`).join('')}</ol>`;
}
function recentIds(type){
  const h=JSON.parse(localStorage.getItem('crHistoryV12')||'[]').slice(0,7);
  return new Set(h.map(x=>type==='mid'?x.midId:x.eveId));
}
function filtered(list,type,excludeId){
  const pref=$('mode').value;
  const nowSeason=season();
  let pool=list.filter(x=>x.s.includes(nowSeason));
  if(pref!=='Tous'){
    pool=pool.filter(x=>x.m===pref || (type==='eve'&&x.m==='Sans cuisson'));
  }
  if(!pool.length)pool=list.filter(x=>x.s.includes(nowSeason));
  if(!pool.length)pool=[...list];
  const recent=recentIds(type);
  let clean=pool.filter(x=>!recent.has(x.id)&&x.id!==excludeId);
  if(!clean.length)clean=pool.filter(x=>x.id!==excludeId);
  if(!clean.length)clean=pool;
  return clean;
}
function pick(list,type,excludeId){
  const pool=filtered(list,type,excludeId);
  return pool[Math.floor(Math.random()*pool.length)];
}
function menuKey(){return current.mid.id+'|'+current.eve.id}
function render(){
  $('midTitle').textContent=current.mid.n;
  $('midMeta').textContent=`⏱️ ${current.mid.t} · 🔥 ${current.mid.m}`;
  $('eveTitle').textContent=current.eve.n;
  $('eveMeta').textContent=`⏱️ ${current.eve.t} · 🔥 ${current.eve.m}`;
  $('midRecipe').innerHTML=recipeHTML(current.mid);
  $('eveRecipe').innerHTML=recipeHTML(current.eve);
  document.querySelectorAll('.recipe').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('[data-target]').forEach(x=>x.textContent='📖 Voir la recette');
  const favs=JSON.parse(localStorage.getItem('crMenus')||'[]');
  const on=favs.includes(menuKey());
  $('favorite').classList.toggle('on',on);
  $('favorite').textContent=on?'★ Menu aimé':'☆ J’aime ce menu';
  saveToday();
  renderHistory();
}
function saveToday(){
  localStorage.setItem('crTodayV12',JSON.stringify({
    date:todayKey(),midId:current.mid.id,eveId:current.eve.id,mode:$('mode').value
  }));
}
function addHistory(){
  let h=JSON.parse(localStorage.getItem('crHistoryV12')||'[]');
  h=h.filter(x=>x.date!==todayKey());
  h.unshift({date:todayKey(),midId:current.mid.id,eveId:current.eve.id,mid:current.mid.n,eve:current.eve.n});
  localStorage.setItem('crHistoryV12',JSON.stringify(h.slice(0,15)));
  renderHistory();
}
function renderHistory(){
  const h=JSON.parse(localStorage.getItem('crHistoryV12')||'[]');
  if(!h.length){$('historyContent').innerHTML='<div class="empty">Aucun ancien menu pour le moment.</div>';return}
  $('historyContent').innerHTML=h.slice(0,7).map(x=>{
    const d=new Date(x.date+'T12:00:00');
    const date=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'}).format(d);
    return `<div class="history-item"><div class="history-date">${date}</div><div class="history-meals">☀️ ${x.mid}<br>🌙 ${x.eve}</div></div>`;
  }).join('');
}
function loadOrCreate(){
  const saved=JSON.parse(localStorage.getItem('crTodayV12')||'null');
  if(saved&&saved.date===todayKey()){
    const mid=noon.find(x=>x.id===saved.midId);
    const eve=evening.find(x=>x.id===saved.eveId);
    if(mid&&eve){current={mid,eve};render();return}
  }
  current.mid=pick(noon,'mid');
  current.eve=pick(evening,'eve');
  render();
  addHistory();
}
function changeMid(){
  current.mid=pick(noon,'mid',current.mid.id);
  render();
  addHistory();
}
function changeEve(){
  current.eve=pick(evening,'eve',current.eve.id);
  render();
  addHistory();
}
function surprise(){
  current.mid=pick(noon,'mid',current.mid.id);
  current.eve=pick(evening,'eve',current.eve.id);
  render();
  addHistory();
}
function show(t){
  $('toast').textContent=t;
  $('toast').classList.add('show');
  setTimeout(()=>$('toast').classList.remove('show'),1900);
}
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.target);
  const open=el.classList.toggle('open');
  b.textContent=open?'📕 Masquer la recette':'📖 Voir la recette';
});
$('changeMid').onclick=changeMid;
$('changeEve').onclick=changeEve;
$('surprise').onclick=surprise;
$('people').onchange=()=>{
  localStorage.setItem('crPeople',$('people').value);
  $('midRecipe').innerHTML=recipeHTML(current.mid);
  $('eveRecipe').innerHTML=recipeHTML(current.eve);
};
$('mode').onchange=()=>{
  localStorage.setItem('crMode',$('mode').value);
  surprise();
};
$('favorite').onclick=()=>{
  const key=menuKey();
  const favs=JSON.parse(localStorage.getItem('crMenus')||'[]');
  const i=favs.indexOf(key);
  if(i>=0)favs.splice(i,1);else favs.push(key);
  localStorage.setItem('crMenus',JSON.stringify(favs));
  render();
  show(i>=0?'Menu retiré des favoris':'Menu enregistré');
};
$('courses').onclick=async()=>{
  const text=`CLAIR REPAS — ${$('people').value} personne(s)

MIDI — ${current.mid.n}
${current.mid.i.map(ingredientText).join('\n')}

SOIR — ${current.eve.n}
${current.eve.i.map(ingredientText).join('\n')}`;
  try{
    await navigator.clipboard.writeText(text);
    show('Liste copiée pour Clair Courses');
  }catch(e){
    prompt('Copie cette liste :',text);
  }
};
loadOrCreate();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
