name: Validate static PWA

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation-9-production"
      - "shopping-v2-engine-test"
      - "shopping-v2-real-world-fixes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static PWA invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check standalone JavaScript syntax
        run: |
          node --check sw.js
          node --check shopping-v2-engine.js
          node --check v8/clair-sync.js
          node --check v8/clair-foundation.js
          node --check v8/clair-cloud-sync.js
          node --check v8/vendor/supabase-js-2.111.0.js
          node --check scripts/generate-public-recipe-catalog.mjs
          node --check scripts/validate-public-recipe-catalog.mjs
          node --check scripts/validate-repair-tool.mjs
          node --check scripts/validate-shopping-qr4.mjs
          node --check scripts/validate-shopping-v2.mjs

      - name: Validate generated public recipe catalog
        run: |
          node scripts/generate-public-recipe-catalog.mjs --check
          node scripts/validate-public-recipe-catalog.mjs

      - name: Validate application and PWA invariants
        run: |
          node scripts/validate-static-app.mjs
          node scripts/validate-cloud-sync.mjs
          node scripts/validate-repair-tool.mjs
          node scripts/validate-shopping-qr4.mjs
          node scripts/validate-shopping-v2.mjs
